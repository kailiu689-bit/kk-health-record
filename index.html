<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fa"><title>kk的健康记录</title>
<style>
:root{--ink:#203449;--muted:#8798a7;--line:#eef2f5;--blue:#2698ed;--bg:#f4f7fa;--shadow:0 8px 28px rgba(39,75,110,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #80c9ff;outline-offset:2px}.wrap{width:min(100% - 32px,550px);margin:auto;padding:30px 0 42px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.identity{display:flex;align-items:center;gap:12px}.avatar{height:49px;width:49px;display:grid;place-items:center;background:#e5f4ee;border-radius:17px;font-size:25px}.eyebrow{font-size:11px;color:#91a1ae;letter-spacing:.14em;font-weight:700;margin-bottom:5px}.name-row{display:flex;align-items:center;gap:8px}.name{font-size:16px;font-weight:750;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit{border:0;background:none;padding:5px;color:#7f97a8;font-size:12px}.date{color:#8e9dab;font-size:12px;text-align:right;line-height:1.6}.intro{margin-bottom:22px}.intro h1{font-size:27px;letter-spacing:.01em;margin:0 0 8px}.intro p{margin:0;color:#8a9aa9;font-size:13px}.section-title{display:flex;align-items:center;gap:9px;margin:24px 2px 12px;font-size:17px;font-weight:750}.section-title .icon{font-size:19px}.section-title small{font-size:11px;letter-spacing:.1em;color:#a4b4c0;font-weight:600;margin-left:auto}.card{background:#fff;border:1px solid #edf2f5;border-radius:22px;box-shadow:var(--shadow);padding:20px}.water-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.sub{color:#91a1ae;font-size:12px}.water-number{font-weight:800;font-size:34px;letter-spacing:-.045em;margin:8px 0 3px}.water-number span{font-size:14px;color:#8aa0ae;letter-spacing:0;font-weight:500;margin-left:5px}.remain{font-size:12px;color:#8d9eab;margin-top:8px}.ring{position:relative;width:112px;height:112px;flex:none}.ring svg{transform:rotate(-90deg);width:100%;height:100%}.ring circle{fill:none;stroke-width:8}.ring .track{stroke:#eaf5fd}.ring .progress{stroke:#28a3f4;stroke-linecap:round;transition:stroke-dashoffset .35s}.ring-label{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:23px;font-weight:800;color:#2599e9}.ring-label small{font-size:10px;font-weight:500;color:#a1b4c2;margin-top:2px}.water-action{margin-top:19px;width:100%;border:0;border-radius:14px;background:#2a9df0;color:white;min-height:52px;font-weight:750;box-shadow:0 6px 15px #2a9df035;font-size:15px}.water-action:active,.add:active{transform:scale(.99)}.water-action span{font-size:20px;margin-right:7px;vertical-align:-1px}.records{margin-top:15px}.record{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:41px;border-top:1px solid #f0f4f6;color:#52697a;font-size:13px}.record .time{color:#a0aeba;margin-right:12px;font-variant-numeric:tabular-nums}.record .detail{flex:1}.remove{border:0;background:#f6f8fa;color:#a3b2bd;border-radius:50%;height:28px;width:28px;font-size:19px;line-height:1}.empty{color:#a5b3be;font-size:12px;padding:14px 0 2px;text-align:center;border-top:1px solid #f0f4f6}.summaries{display:grid;gap:8px;margin-bottom:17px}.summary{border-radius:12px;background:var(--tint);padding:11px 12px;display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:var(--color);flex:none}.summary strong{font-size:13px;white-space:nowrap}.summary .value{margin-left:auto;font-size:12px;color:#5f7586;text-align:right;line-height:1.6}.empty-sport{padding:14px;background:#f8fafb;text-align:center;border-radius:12px;color:#9aaab6;font-size:12px;margin-bottom:17px}.label{font-size:12px;color:#8799a6;font-weight:600;margin-bottom:10px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.chip{background:#f8fafb;border:1px solid #edf2f5;border-radius:11px;height:39px;color:#718795;font-size:13px}.chip.active{background:var(--tint);color:var(--color);border-color:var(--color);font-weight:700}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{font-size:12px;color:#8799a6;display:block;margin-bottom:7px}.input-wrap{position:relative}.field input{width:100%;height:46px;border:1px solid #eaf0f4;background:#fafcfd;border-radius:11px;padding:0 42px 0 12px;color:#294457;font-size:15px;outline:none}.field input:focus{border-color:#7dc5f8;background:white}.unit{position:absolute;right:12px;top:14px;color:#a3b3bd;font-size:12px}.add{width:100%;height:48px;border:0;border-radius:12px;background:#263e52;color:white;font-weight:700;margin-top:14px}.note{min-height:16px;font-size:12px;color:#e66a67;margin:8px 0 0}.sport-records{margin-top:7px}.section-footer{display:flex;align-items:center;justify-content:space-between;margin-top:25px;gap:10px}.section-footer p{color:#9eacb6;font-size:11px;line-height:1.6;margin:0}.share{border:1px solid #dbe9f2;background:#fff;color:#388cc7;border-radius:12px;padding:12px 15px;font-weight:700;white-space:nowrap}.modal{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:20px;background:#1c33495f}.modal[hidden]{display:none}.dialog{background:white;border-radius:22px;width:min(100%,420px);padding:22px;max-height:90dvh;overflow:auto}.dialog h2{margin:0 0 16px;font-size:19px}.dialog input{border:1px solid #dce7ee;border-radius:12px;height:47px;width:100%;padding:0 12px}.dialog-actions{display:flex;gap:10px;margin-top:15px}.dialog-actions button,.save-image{flex:1;border:0;border-radius:12px;height:46px;font-weight:700}.secondary{background:#f1f5f8;color:#6a8191}.primary,.save-image{background:#2699eb;color:white}.preview{display:block;width:100%;height:auto;border-radius:14px;background:#f3f8fb}.modal-hint{color:#91a2af;font-size:12px;line-height:1.6;text-align:center;margin:12px 0}.save-image{display:block;width:100%;text-align:center;text-decoration:none;line-height:46px}.close-card{width:100%;border:0;background:none;color:#90a1ac;padding:14px 0 0}.card-head{display:flex;justify-content:space-between;align-items:center}.card-head h2{margin-bottom:14px}.xclose{border:0;background:#f4f7f9;border-radius:50%;width:30px;height:30px;color:#899aa6;font-size:20px;margin-top:-14px}@media(max-width:360px){.wrap{width:calc(100% - 24px)}.card{padding:17px}.name{max-width:120px}.date{font-size:11px}.water-number{font-size:30px}}
</style></head>
<body><main class="wrap"><header class="header"><div class="identity"><div class="avatar" aria-label="头像">🌱</div><div><div class="eyebrow">HEALTH JOURNAL</div><div class="name-row"><span class="name" id="nickname"></span><button class="edit" id="editName" aria-label="编辑昵称">✎ 编辑</button></div></div></div><div class="date" id="date"></div></header>
<div class="intro"><h1>kk的健康记录</h1><p>把每一个照顾自己的瞬间，轻轻记下来。</p></div>
<h2 class="section-title"><span class="icon">💧</span>今日饮水 <small>STAY HYDRATED</small></h2><section class="card" aria-label="今日饮水"><div class="water-top"><div><div class="sub">今日已喝</div><div class="water-number"><span id="waterTotal" style="font-size:inherit;color:inherit;font-weight:inherit;margin:0">0</span><span>ml</span></div><div class="sub">每日目标 2,000 ml</div><div class="remain" id="remaining"></div></div><div class="ring"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="track" cx="56" cy="56" r="47"></circle><circle class="progress" id="progress" cx="56" cy="56" r="47" stroke-dasharray="295.31" stroke-dashoffset="295.31"></circle></svg><div class="ring-label"><span id="percent">0%</span><small>目标完成</small></div></div></div><button class="water-action" id="addWater"><span>＋</span>喝了一杯 · 250 ml</button><div class="records" id="waterRecords"></div></section>
<h2 class="section-title"><span class="icon">🏃</span>今日运动 <small>KEEP MOVING</small></h2><section class="card" aria-label="今日运动"><div class="label">今日合计</div><div id="sportSummary"></div><div class="label">选择运动</div><div class="chips" id="chips"></div><div class="fields" id="fields"></div><button class="add" id="addSport">＋ 添加运动记录</button><p class="note" id="error" role="alert"></p><div class="sport-records" id="sportRecords"></div></section>
<div class="section-footer"><p>每一次小小的坚持<br>都值得被记录 ✨</p><button class="share" id="openCard">✦ 生成今日记录卡</button></div></main>
<div class="modal" id="nameModal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="nameTitle"><h2 id="nameTitle">编辑昵称</h2><input id="nameInput" maxlength="16" placeholder="请输入昵称" aria-label="昵称"><p class="note" id="nameError"></p><div class="dialog-actions"><button class="secondary" id="cancelName">取消</button><button class="primary" id="saveName">保存昵称</button></div></div></div>
<div class="modal" id="cardModal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cardTitle"><div class="card-head"><h2 id="cardTitle">今日记录卡</h2><button class="xclose" id="closeCard" aria-label="关闭">×</button></div><img class="preview" id="preview" alt="今日健康记录卡预览，长按图片可以保存"><p class="modal-hint">长按图片即可保存，也可以点击下方按钮</p><a class="save-image" id="download" download="kk的今日健康记录.png">保存图片</a><button class="close-card" id="closeCardBottom">完成</button></div></div>
<script>
(function(){'use strict';
const KEY='kk-health-record-v1',GOAL=2000; const sports=[{name:'跑步',color:'#ef8a69',tint:'#fff3ee',distance:true},{name:'散步',color:'#68ad91',tint:'#eef9f3',distance:true},{name:'骑行',color:'#718fd9',tint:'#f0f3ff',distance:true},{name:'拉伸',color:'#c18bc3',tint:'#fbf1fb'},{name:'跳绳',color:'#e7ad58',tint:'#fff8eb',count:true},{name:'瑜伽',color:'#aa93d0',tint:'#f6f2fc'}]; let selected='跑步';let state={nickname:'健康记录员',water:[],sports:[]};try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){state.nickname=typeof s.nickname==='string'&&s.nickname.trim()?s.nickname:'健康记录员';state.water=Array.isArray(s.water)?s.water:[];state.sports=Array.isArray(s.sports)?s.sports:[]}}catch(e){}let storageOK=true;function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;document.querySelector('.section-footer p').textContent='浏览器无法保存数据，请检查存储权限。'}}const $=id=>document.getElementById(id);const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let activeDay=today();const current=a=>a.filter(x=>x.day===today());const fmt=n=>Number(Number(n).toFixed(2)).toLocaleString('zh-CN',{maximumFractionDigits:2});const when=t=>{let d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};const pace=(mins,km)=>{let sec=Math.round(mins/km*60);return `${Math.floor(sec/60)}′${String(sec%60).padStart(2,'0')}″/公里`};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function totals(){return sports.map(s=>{let rs=current(state.sports).filter(r=>r.type===s.name);return {...s,rs,minutes:rs.reduce((a,r)=>a+Number(r.minutes||0),0),km:rs.reduce((a,r)=>a+Number(r.km||0),0),count:rs.reduce((a,r)=>a+Number(r.count||0),0)}}).filter(s=>s.rs.length)}function summaryText(s){let a=[];if(s.distance)a.push(fmt(s.km)+' 公里');a.push(fmt(s.minutes)+' 分钟');if(s.count)a.push(fmt(s.count)+' 次');if(s.name==='跑步'&&s.km>0)a.push('平均配速 '+pace(s.minutes,s.km));return a.join(' · ')}
function addRecord(container,time,content,onRemove,label){let row=el('div','record'),t=el('span','time',when(time)),d=el('span','detail',content),b=el('button','remove','×');b.setAttribute('aria-label','撤销'+label+'记录');b.onclick=onRemove;row.append(t,d,b);container.append(row)}
function render(){activeDay=today();$('nickname').textContent=state.nickname;let now=new Date();$('date').innerHTML='';$('date').append(document.createTextNode((now.getMonth()+1)+'月'+now.getDate()+'日'),document.createElement('br'),document.createTextNode('星期'+'日一二三四五六'[now.getDay()]));let waters=current(state.water),total=waters.length*250,p=Math.round(total/GOAL*100);$('waterTotal').textContent=total.toLocaleString('zh-CN');$('percent').textContent=p+'%';$('remaining').textContent=total>=GOAL?'今天的饮水目标已达成 ✨':'距离目标还差 '+(GOAL-total).toLocaleString('zh-CN')+' ml';$('progress').style.strokeDashoffset=295.31*(1-Math.min(total/GOAL,1));let wr=$('waterRecords');wr.replaceChildren();if(!waters.length)wr.append(el('div','empty','喝下第一杯水，开启元气一天'));else [...waters].reverse().forEach(r=>addRecord(wr,r.time,'饮水 250 ml',()=>{state.water=state.water.filter(x=>x.id!==r.id);save();render()},'饮水'));let sums=totals(),sc=$('sportSummary');sc.replaceChildren();if(!sums.length)sc.append(el('div','empty-sport','今日暂无运动记录'));else {let box=el('div','summaries');sums.forEach(s=>{let row=el('div','summary');row.style.setProperty('--tint',s.tint);row.style.setProperty('--color',s.color);row.append(el('span','dot'),el('strong','',s.name),el('span','value',summaryText(s)));box.append(row)});sc.append(box)}let sr=$('sportRecords');sr.replaceChildren();[...current(state.sports)].reverse().forEach(r=>{let s=sports.find(x=>x.name===r.type);if(!s)return;let str=r.type+' · ';if(s.distance)str+=fmt(r.km)+' 公里 · ';str+=fmt(r.minutes)+' 分钟';if(s.count)str+=' · '+fmt(r.count)+' 次';if(r.type==='跑步')str+=' · 配速 '+pace(r.minutes,r.km);addRecord(sr,r.time,str,()=>{state.sports=state.sports.filter(x=>x.id!==r.id);save();render()},r.type)});if(!$('cardModal').hidden)drawCard()}
function renderChoices(){let c=$('chips');c.replaceChildren();sports.forEach(s=>{let b=el('button','chip'+(s.name===selected?' active':''),s.name);b.style.setProperty('--color',s.color);b.style.setProperty('--tint',s.tint);b.setAttribute('aria-pressed',s.name===selected);b.onclick=()=>{selected=s.name;renderChoices();$('error').textContent=''};c.append(b)});let f=$('fields');f.replaceChildren();let s=sports.find(x=>x.name===selected);if(s.distance)field(f,'km','距离','公里','0.00');field(f,'minutes','时长','分钟','0');if(s.count)field(f,'count','次数','次','0')}
function field(parent,key,label,unit,placeholder){let f=el('div','field'),l=el('label','',label),w=el('div','input-wrap'),input=el('input');input.type='number';input.inputMode='decimal';input.min='0';input.step=key==='count'?'1':'any';input.placeholder=placeholder;input.id='field-'+key;l.htmlFor=input.id;let u=el('span','unit',unit);w.append(input,u);f.append(l,w);parent.append(f)}
$('addWater').onclick=()=>{state.water.push({id:id(),time:Date.now(),day:today()});save();render()};$('addSport').onclick=()=>{let s=sports.find(x=>x.name===selected),m=Number($('field-minutes').value),km=s.distance?Number($('field-km').value):0,count=s.count?Number($('field-count').value):0;if(!Number.isFinite(m)||m<=0||(s.distance&&(!Number.isFinite(km)||km<=0))||(s.count&&(!Number.isInteger(count)||count<=0))||m>10080||km>10000||count>1000000){$('error').textContent=s.count?'请填写大于 0 的时长和整数次数。':'请填写大于 0 的有效'+(s.distance?'距离和时长。':'时长。');return}state.sports.push({id:id(),day:today(),time:Date.now(),type:s.name,minutes:m,km,count});save();renderChoices();$('error').textContent='';render()};
$('editName').onclick=()=>{$('nameInput').value=state.nickname;$('nameError').textContent='';$('nameModal').hidden=false;setTimeout(()=>$('nameInput').focus(),50)};function closeName(){$('nameModal').hidden=true;$('editName').focus()}$('cancelName').onclick=closeName;$('saveName').onclick=()=>{let n=$('nameInput').value.trim();if(!n){$('nameError').textContent='昵称不能为空';return}state.nickname=n;save();render();closeName()};$('nameInput').onkeydown=e=>{if(e.key==='Enter')$('saveName').click()};
function round(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}function drawCard(){let cv=document.createElement('canvas');cv.width=900;let items=totals();cv.height=950+Math.max(1,items.length)*78;let c=cv.getContext('2d'),W=cv.width,H=cv.height;c.fillStyle='#eff6fa';c.fillRect(0,0,W,H);c.fillStyle='#ffffff';round(c,45,45,810,H-90,35);c.fill();c.fillStyle='#eaf7f0';round(c,85,88,100,100,30);c.fill();c.font='52px sans-serif';c.fillText('🌱',108,158);c.fillStyle='#91a6b4';c.font='bold 21px sans-serif';c.fillText('MY HEALTH JOURNAL',213,120);c.fillStyle='#203b50';c.font='bold 36px sans-serif';c.fillText(state.nickname,213,168,500);let d=new Date();c.fillStyle='#93a6b3';c.font='22px sans-serif';c.fillText(`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`,88,243);c.fillStyle='#223c50';c.font='bold 46px sans-serif';c.fillText('今日健康记录',88,310);c.fillStyle='#92a5b2';c.font='23px sans-serif';c.fillText('每一点坚持，都在照顾更好的自己',88,355);c.fillStyle='#f1f9ff';round(c,85,395,730,255,24);c.fill();c.fillStyle='#4299d5';c.font='bold 23px sans-serif';c.fillText('💧  今日饮水',115,442);let water=current(state.water).length*250,per=Math.round(water/GOAL*100);c.fillStyle='#203c51';c.font='bold 60px sans-serif';c.fillText(water.toLocaleString('zh-CN'),115,520);c.fillStyle='#91aab9';c.font='24px sans-serif';c.fillText('ml  /  2,000 ml',115,557);c.fillStyle='#dceef9';round(c,115,585,480,14,7);c.fill();if(water){c.fillStyle='#2b9def';round(c,115,585,Math.max(14,480*Math.min(1,water/GOAL)),14,7);c.fill()}c.fillStyle='#2699eb';c.font='bold 38px sans-serif';c.textAlign='right';c.fillText(per+'%',780,520);c.fillStyle='#8eabbc';c.font='20px sans-serif';c.fillText(water>=GOAL?'目标已达成':'还差 '+(GOAL-water)+' ml',780,557);c.textAlign='left';c.fillStyle='#243f52';c.font='bold 27px sans-serif';c.fillText('🏃  今日运动',90,710);if(!items.length){c.fillStyle='#a2b1ba';c.font='24px sans-serif';c.fillText('今日暂无运动记录',93,768)}else items.forEach((s,i)=>{let y=760+i*78;c.fillStyle=s.color;c.beginPath();c.arc(100,y-7,6,0,Math.PI*2);c.fill();c.fillStyle='#324d5f';c.font='bold 24px sans-serif';c.fillText(s.name,122,y);c.textAlign='right';c.fillStyle='#6f8796';c.font='22px sans-serif';c.fillText(summaryText(s),810,y,570);c.textAlign='left'});c.fillStyle='#a1b4c0';c.font='20px sans-serif';c.fillText('KK 的健康记录  ·  继续保持好状态',90,H-91);let url=cv.toDataURL('image/png');$('preview').src=url;$('download').href=url}
$('openCard').onclick=()=>{$('cardModal').hidden=false;drawCard()};function closeCard(){$('cardModal').hidden=true;$('openCard').focus()}$('closeCard').onclick=closeCard;$('closeCardBottom').onclick=closeCard;[$('nameModal'),$('cardModal')].forEach(m=>m.addEventListener('click',e=>{if(e.target===m){if(m===$('nameModal'))closeName();else closeCard()}}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('nameModal').hidden)closeName();if(!$('cardModal').hidden)closeCard()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeDay!==today())render()});setInterval(()=>{if(activeDay!==today())render()},30000);renderChoices();render();
})();
</script></body></html>
