<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GitHub 云数据库连接测试</title><style>body{margin:0;background:#fbf5ef;color:#503c34;font:16px/1.7 system-ui,-apple-system,sans-serif}main{max-width:600px;margin:32px auto;padding:22px}article{background:#fff;border-radius:20px;padding:24px}button{background:#c97b5c;color:white;border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;margin:8px 8px 8px 0}a{color:#a55338}#result{padding:14px;background:#fbf5ef;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><article><h1>GitHub 云数据库连接测试</h1><p>这是独立测试页面，只使用虚构的 250 毫升数据，不读取或改动您的健康记录。</p><p>请先在同一浏览器里打开 <a target="_blank" rel="noopener" href="https://health-sync-poc-20261113-a.kk-happy.chatgpt.site/">私有测试站点</a>，确保已登录，然后返回本页。</p><button id="read">测试读取</button><button id="write">测试写入并读取</button><p>如果上面的直接连接失败，可以试下面的窗口连接方式：</p><button id="window-test">使用登录窗口测试</button><p id="result" role="status">等待测试。</p><p>如提示失败，请记下页面提示；不必关闭浏览器安全设置。</p></article></main><script>
const endpoint='https://health-sync-poc-20261113-a.kk-happy.chatgpt.site/api/probe';
const out=document.getElementById('result');
async function read(){const r=await fetch(endpoint,{method:'GET',credentials:'include',cache:'no-store'});if(!r.ok)throw Error('读取返回 HTTP '+r.status);const value=(await r.json()).value;if(value!=='sample-250ml')throw Error('未找到预期的测试数据');return value;}
document.getElementById('read').onclick=async()=>{out.textContent='正在测试读取…';try{await read();out.textContent='读取成功：GitHub 网页已读到云端虚构的 250 毫升测试数据。'}catch(e){out.textContent='读取未成功：'+e.message+'。请确认已在同一浏览器登录私有测试站点；也可能是跨网站访问或浏览器隐私限制。'}};
document.getElementById('write').onclick=async()=>{out.textContent='正在测试写入…';try{const r=await fetch(endpoint,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('写入返回 HTTP '+r.status);await read();out.textContent='写入并读取成功：GitHub 网页与云端数据库连接正常。'}catch(e){out.textContent='写入或读取未成功：'+e.message+'。请确认已在同一浏览器登录私有测试站点；也可能是跨网站访问或浏览器隐私限制。'}};

document.getElementById('window-test').onclick=()=>{
  const target='https://health-sync-poc-20261113-a.kk-happy.chatgpt.site';
  const nonce=crypto.randomUUID();
  let child=null, sent=false;
  function done(message){window.removeEventListener('message',onMessage);clearTimeout(timer);out.textContent=message}
  function onMessage(event){
    if(event.origin!==target||event.source!==child||!event.data)return;
    const m=event.data;
    if(m.type==='kk-test-ready'&&!sent){sent=true;child.postMessage({type:'kk-test-request',nonce,action:'write'},target)}
    if(m.type==='kk-test-result'&&m.nonce===nonce){
      if(m.ok){done('窗口连接测试成功：GitHub 页面已通过私有测试窗口写入并读回虚构的 250 毫升。');child.close()}
      else done('窗口连接测试未完成：'+String(m.error||'未知错误'));
    }
  }
  window.addEventListener('message',onMessage);
  const timer=setTimeout(()=>done('窗口连接测试超时。请检查窗口是否打开以及是否已登录，之后再告诉我。'),120000);
  child=window.open(target+'/bridge','kk-connection-test','popup,width=500,height=580');
  if(!child){done('浏览器没有打开测试窗口。请告诉我页面提示。');return}
  out.textContent='已打开私有测试窗口，请保持它打开；如要求登录，请登录后返回本页查看结果。';
};
</script></body></html>
